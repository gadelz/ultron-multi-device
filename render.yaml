services:
  ultron-gateway:
    image: python:3.11-slim
    command: uvicorn src.gateway.server:app --host 0.0.0.0 --port $PORT
    ports:
      - 8080
    environment:
      - ULTRON_API_KEY=${ULTRON_API_KEY:-changeme}
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy}
      - DATABASE_URL=sqlite:////data/ultron.db
    volumes:
      - data:/data
    restart: always

volumes:
  data:
