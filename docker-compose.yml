version: "3.8"
services:
  ultron-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ULTRON_API_KEY=${ULTRON_API_KEY:-changeme}
      - LLM_PROVIDER=openai
      - DATABASE_URL=sqlite:////data/ultron.db
    volumes:
      - ultron-data:/data
    restart: unless-stopped

volumes:
  ultron-data:
